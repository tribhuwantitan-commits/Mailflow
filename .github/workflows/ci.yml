name: CI

# Why this exists: the only deploy host is a Windows RDP box on a data-centre IP
# that GitHub refuses to sign in to, so "run the tests and see" needed a human to
# open a remote desktop, activate a venv and type a command. That made the loop
# slow enough that steps got skipped. GitHub's runners are debit-free and need no
# RDP session, so the loop belongs here: push, read the verdict, then touch the
# server only when there is something to touch.
#
# The contract is deliberately narrow: ruff and pytest, on the same Python the
# server uses. Anything that needs a real database, real SES credentials or a
# running service stays on the server, because a green tick here must never be
# mistaken for "deployed".

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A second push to the same branch cancels the first: the answer for the older
# commit is no longer interesting, and queued runs are the main way this gets slow.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: ruff + pytest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Ruff (lint)
        run: ruff check app tests

      - name: Ruff (format check)
        run: ruff format --check app tests

      # No MAILFLOW_TEST_POSTGRES_URL is set on purpose: the Postgres integration
      # test skips itself, which is the same result the server sees. PostgreSQL is
      # validated separately, against the real database, before a deploy.
      - name: Pytest
        run: pytest -q

      # The suite is the gate, not a suggestion: a silently-skipped or
      # silently-empty run would still exit 0 and look identical in the log.
      # Truthy thresholds only — no `sys.exit(message)` here, because a string
      # argument prints to stderr and still exits 0, which is a green tick on a
      # broken run.
      - name: Assert the suite actually ran
        run: |
          python - <<'PY'
          import re
          import subprocess as sp
          import sys

          out = sp.run(
              [sys.executable, "-m", "pytest", "-q", "--collect-only"],
              capture_output=True,
              text=True,
          ).stdout
          match = re.search(r"(\d+) tests? collected", out)
          if not match:
              print(f"could not read a test count from:\n{out[-800:]}")
              raise SystemExit(1)
          collected = int(match.group(1))
          if collected < 150:
              print(f"only {collected} tests collected; expected at least 150")
              raise SystemExit(1)
          print(f"collected {collected} tests")
          PY
